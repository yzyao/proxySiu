name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ProxySiu.Web/package-lock.json
      - run: dotnet restore ProxySiu.slnx
      - run: dotnet build ProxySiu.slnx --no-restore
      - run: dotnet run --project tests/ProxySiu.Api.Tests/ProxySiu.Api.Tests.csproj --no-restore
      - run: npm ci
        working-directory: src/ProxySiu.Web
      - run: npm run build
        working-directory: src/ProxySiu.Web
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
        working-directory: src/ProxySiu.Web

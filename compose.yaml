services:
  api:
    build:
      context: ./src/ProxySiu.Api
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5080
      ProxyPool__AllowInternalNetworkAccess: "true"
      PROXYSIU_PROFILE: ${PROXYSIU_PROFILE:-idc-safe}
      ProxyAuth__Enabled: "true"
      ProxyAuth__AccessToken: ${PROXYSIU_ACCESS_TOKEN:?set PROXYSIU_ACCESS_TOKEN in .env}
      ProxyAuth__CookieSecure: "true"
      GeoIp__DatabasePath: /app/geoip/GeoLite2-City.mmdb
      GeoIp__UseIpSb: ${PROXYSIU_GEOIP_USE_IP_SB:-true}
      GeoIp__IpSbLookupIntervalSeconds: ${PROXYSIU_GEOIP_IP_SB_LOOKUP_INTERVAL_SECONDS:-2}
    volumes:
      - proxy-data:/app/data
      - ${PROXYSIU_GEOIP_DIR:-./geoip}:/app/geoip:ro
    restart: unless-stopped
    networks:
      - internal

  web:
    build:
      context: ./src/ProxySiu.Web
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  proxy-data:

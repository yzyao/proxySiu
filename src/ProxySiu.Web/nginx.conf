map $http_x_forwarded_proto $proxysiu_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep HTTPS from the host Nginx; fall back to this container's scheme locally.
        proxy_set_header X-Forwarded-Proto $proxysiu_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
